# Couleurs générées par ~/dotfiles/theme/apply.sh
source = ~/.config/hypr/colors.conf

$font = JetBrainsMono Nerd Font

general {
    disable_loading_bar = true
    hide_cursor = true
}

background {
    monitor =
    path = ~/.config/backgrounds/shaded.png
    blur_passes = 2
    color = $bg
}

label {
    monitor =
    text = cmd[update:30000] echo "$(date +"%R")"
    color = $fg
    font_size = 90
    font_family = $font
    position = -30, 0
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %d %B %Y")"
    color = $fg
    font_size = 25
    font_family = $font
    position = -30, -150
    halign = right
    valign = top
}

image {
    monitor =
    path = ~/.face
    size = 100
    border_color = $fg
    position = 0, 75
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 4
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $fg
    inner_color = $bg
    font_color = $fg
    fade_on_empty = false
    placeholder_text = <span foreground="##$fgHex"><i>󰌾 Logged in as </i><span foreground="##$fgHex">$USER</span></span>
    hide_input = false
    check_color = $fg
    fail_color = $error
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $accent
    position = 0, -35
    halign = center
    valign = center
}